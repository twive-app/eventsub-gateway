name: Docker Publish

on:
  push:
    branches:
      - dev
  release:
    types:
      - published
  # Weekly rebuild of the latest release with updated base images.
  schedule:
    - cron: '0 0 * * 1'

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

permissions:
  contents: read

jobs:
  # Typecheck, ESLint, audit and tests of lint.yaml – no image of a red commit. The weekly rebuild uses the tag that
  # was checked when it was released.
  checks:
    name: Checks
    if: "github.event_name == 'release' || (github.event_name == 'push' && !contains(github.event.head_commit.message, 'skip docker') && !contains(github.event.head_commit.message, 'docker skip'))"
    uses: ./.github/workflows/lint.yaml

  build-and-push:
    name: Build and Push
    needs: checks
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write         # provenance attestation
      attestations: write
      security-events: write  # vulnerability scan results
    # Runs when the checks passed, or were skipped for the weekly rebuild – not when [skip docker] skipped them.
    if: "!failure() && !cancelled() && (github.event_name == 'schedule' || needs.checks.result == 'success')"
    steps:
      # Fetch the latest release tag before checkout and metadata so we can check out the correct ref and tag the image.
      - name: Get latest release tag (scheduled)
        id: release_info
        if: github.event_name == 'schedule'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          LATEST_TAG=$(gh api "repos/${{ github.repository }}/releases/latest" --jq '.tag_name')
          if [ -z "$LATEST_TAG" ] || [ "$LATEST_TAG" = "null" ]; then
            echo "No release found"
            exit 1
          fi
          echo "tag=$LATEST_TAG" >> "$GITHUB_OUTPUT"

      - name: Code checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ steps.release_info.outputs.tag || github.ref }}
          fetch-depth: 0  # dev images name the latest release tag in their version

      - name: Get build information
        id: build_info
        env:
          EVENT_NAME: ${{ github.event_name }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
          SCHEDULE_TAG: ${{ steps.release_info.outputs.tag }}
          BRANCH: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          SHORT_SHA=$(git rev-parse --short HEAD)
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          echo "short_sha=$SHORT_SHA" >> "$GITHUB_OUTPUT"

          # The version comes from the tag (the Dockerfile writes it into package.json): releases and their weekly
          # rebuild use the release tag, dev images the latest tag before them plus the commit: 1.2.3-dev.abc1234.
          case "$EVENT_NAME" in
            schedule|release)
              TAG="${RELEASE_TAG:-$SCHEDULE_TAG}"
              VERSION="${TAG#v}"
              if ! [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-(alpha|beta|rc)\.[0-9]+)?$ ]]; then
                echo "::error::Invalid release tag '$TAG' – use vX.Y.Z or vX.Y.Z-alpha.N, vX.Y.Z-beta.N, vX.Y.Z-rc.N"
                exit 1
              fi
              echo "version=$VERSION" >> "$GITHUB_OUTPUT"
              ;;
            push)
              LAST_TAG=$(git describe --tags --abbrev=0 --match 'v[0-9]*' 2>/dev/null || echo v0.0.0)
              echo "version=${LAST_TAG#v}-$BRANCH.$SHORT_SHA" >> "$GITHUB_OUTPUT"
              ;;
          esac

      - name: Docker metadata
        id: docker_meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          flavor: |
            latest=false
          tags: |
            type=raw,value=latest,enable=${{ (github.event_name == 'release' && github.event.action == 'published' && github.event.release.prerelease == false) || github.event_name == 'schedule' }}
            type=raw,value=${{ steps.release_info.outputs.tag }},enable=${{ github.event_name == 'schedule' }}
            type=ref,event=tag
            type=ref,event=branch,enable=${{ github.event_name == 'push' }}
            type=raw,value=alpha,enable=${{ github.event_name == 'release' && github.event.release.prerelease && contains(github.event.release.tag_name, '-alpha') }}
            type=raw,value=beta,enable=${{ github.event_name == 'release' && github.event.release.prerelease && contains(github.event.release.tag_name, '-beta') }}
            type=raw,value=rc,enable=${{ github.event_name == 'release' && github.event.release.prerelease && contains(github.event.release.tag_name, '-rc') }}
          labels: |
            org.opencontainers.image.version=${{ steps.build_info.outputs.version }}
            org.opencontainers.image.revision=${{ steps.build_info.outputs.sha }}
            org.opencontainers.image.licenses=MIT

      # No QEMU: the Dockerfile cross-compiles on the build platform and the runtime stage has no RUN instructions.
      - name: Setup Docker buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Login to GitHub Container Registry
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # sbom/provenance: attestations inside the image index (`docker buildx imagetools inspect --format '{{json .SBOM}}'`).
      - name: Build and Push (tag)
        id: build_tag
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        if: "(github.event_name == 'release' && github.event.action == 'published') || github.event_name == 'schedule'"
        with:
          context: .
          file: ./Dockerfile
          push: true
          platforms: 'linux/amd64,linux/arm64'
          build-args: |
            VERSION=${{ steps.build_info.outputs.version }}
            REVISION=${{ steps.build_info.outputs.sha }}
          labels: ${{ steps.docker_meta.outputs.labels }}
          tags: ${{ steps.docker_meta.outputs.tags }}
          cache-from: type=gha,scope=tagged
          cache-to: type=gha,scope=tagged,mode=max
          provenance: mode=max
          sbom: true

      - name: Build and Push (branch)
        id: build_branch
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        if: "github.event_name == 'push'"
        with:
          context: .
          file: ./Dockerfile
          push: true
          platforms: 'linux/amd64,linux/arm64'
          build-args: |
            VERSION=${{ steps.build_info.outputs.version }}
            REVISION=${{ steps.build_info.outputs.sha }}
          labels: ${{ steps.docker_meta.outputs.labels }}
          tags: ${{ steps.docker_meta.outputs.tags }}
          cache-from: type=gha,scope=${{ github.ref_name }}
          cache-to: type=gha,scope=${{ github.ref_name }},mode=max
          provenance: mode=max
          sbom: true

      # Signed build provenance in GitHub's attestation store (not in the registry, so cleanup-images.yaml can't remove
      # it): gh attestation verify oci://ghcr.io/twive-app/eventsub-gateway:<tag> --owner twive-app
      - name: Attest build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          subject-digest: ${{ steps.build_tag.outputs.digest || steps.build_branch.outputs.digest }}
          push-to-registry: false

      # Known vulnerabilities of the runtime image (the distroless base) – reported in the Security tab, not blocking:
      # the weekly rebuild picks up fixed base images.
      - name: Scan the image
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        env:
          TRIVY_USERNAME: ${{ github.repository_owner }}
          TRIVY_PASSWORD: ${{ secrets.GITHUB_TOKEN }}
        with:
          image-ref: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}@${{ steps.build_tag.outputs.digest || steps.build_branch.outputs.digest }}
          format: sarif
          output: trivy.sarif
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: "0"
      - name: Upload the scan results
        uses: github/codeql-action/upload-sarif@1bd86f2fdb4b86187fa4059f16f31a3202acc9ea # v4.39.4
        with:
          sarif_file: trivy.sarif
          category: container-image
