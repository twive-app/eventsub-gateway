name: lint

on:
  push:
    branches:
      - main
      - dev
  pull_request:
    branches:
      - "**"
  # release.yaml and docker-publish.yml run the same checks before they build anything.
  workflow_call:

permissions:
  contents: read

jobs:
  lint:
    name: Typecheck & ESLint
    runs-on: ubuntu-latest
    # The integration tests run against a real Redis – the same version as in compose.yml.
    services:
      redis:
        image: redis:8.10.3-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 2s
          --health-timeout 2s
          --health-retries 15
    steps:
      - name: Code checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # The version comes from the release tag – the workflows write it into package.json while building.
      - name: Placeholder version
        run: |
          if [ "$(jq -r .version package.json)" != "0.0.0" ]; then
            echo "::error file=package.json::package.json must keep version 0.0.0 – the release workflows set the version from the tag"
            exit 1
          fi

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: package.json

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Typecheck
        run: bun run typecheck

      - name: ESLint
        run: bun run lint:check

      # Only what ends up in the executable – advisories of dev tools (ESLint, commitlint) don't block a release.
      - name: Audit dependencies
        run: bun audit --prod --audit-level=high

      # Bun's coverageThreshold applies to every single file, so the total is checked here instead.
      - name: Tests
        run: |
          set -euo pipefail
          bun run test --coverage 2>&1 | tee coverage.txt
          awk -F'|' '/^All files/ {
            gsub(/ /, "", $2); gsub(/ /, "", $3)
            printf "Coverage: %s %% functions, %s %% lines (minimum %d %%)\n", $2, $3, min
            found = 1
            if ($2 + 0 < min || $3 + 0 < min) failed = 1
          } END { exit (!found || failed) }' min=90 coverage.txt
        env:
          TEST_REDIS_URL: redis://localhost:6379/0

  # New dependencies of a pull request with known vulnerabilities (high or worse) or a license that isn't permissive.
  dependencies:
    name: Dependency review
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Code checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Dependency review
        uses: actions/dependency-review-action@bbc44d14a204704ccc493733616cd1e93a0321ec # v5.0.1
        with:
          fail-on-severity: high
          deny-licenses: GPL-2.0-only, GPL-2.0-or-later, GPL-3.0-only, GPL-3.0-or-later, AGPL-3.0-only, AGPL-3.0-or-later

  # PRs are merged with a merge commit, so every commit of the PR lands on dev – each one is checked, not only the title.
  # commitlint skips merge commits by default (defaultIgnores).
  commits:
    name: Commit messages
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Code checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: package.json

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Commitlint
        run: bunx commitlint --from ${{ github.event.pull_request.base.sha }} --to ${{ github.event.pull_request.head.sha }} --verbose
