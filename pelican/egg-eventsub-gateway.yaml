name: "EventSub Gateway powered by twive.app"
author: dev@aysib07.de
uuid: 947fe642-e10f-4917-adeb-b6daf232eb63
description: |-
  All of Twitch EventSub through one WebSocket connection: the gateway sets up the conduit, creates the subscriptions
  for every authorized user, watches revocations and forwards every event to your app's clients over a WebSocket,
  with missed events replayed after a reconnect. Needs a Redis with persistence and two allocations – the
  primary one for the webhook (HTTP) and a second one for the WebSocket. Both belong behind a reverse proxy with
  TLS. https://github.com/twive-app/eventsub-gateway
tags:
  - twitch
  - eventsub
  - websocket
  - gateway
