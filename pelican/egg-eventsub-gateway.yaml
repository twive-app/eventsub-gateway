    description: "Public HTTPS URL of POST /twitch/webhook/callback – your reverse proxy in front of the primary allocation, e.g. https://api.example.com/twitch/webhook/callback. Twitch only calls HTTPS on port 443."
    env_variable: TWITCH_WEBHOOK_CALLBACK_URL
    default_value: ""
    user_viewable: true
    user_editable: true
